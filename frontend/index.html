<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fankaar Digital — Jarvis Command</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Critical fallback: tab switching always works even if external CSS cached */
        .tab-panel { display: none !important; }
        .tab-panel.active { display: flex !important; }
    </style>
</head>
<body>
    <div class="jarvis-container">
        <header>
            <h1>FANKAAR DIGITAL</h1>
            <div class="system-status">
                <span class="status-dot online" id="system-dot"></span>
                <span class="status-text" id="system-status">SYSTEM ONLINE</span>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="chat">💬 Chat</button>
            <button class="tab-btn" data-tab="report">📊 Daily Report</button>
            <button class="tab-btn" data-tab="agents">⚡ Agents</button>
        </nav>

        <!-- Chat Tab -->
        <section class="tab-panel active" id="tab-chat">
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="message system">
                        <p>Welcome back, sir. All systems operational. 23 agents standing by.</p>
                    </div>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="text-input" placeholder="Type a command for Jon..." autocomplete="off">
                    <button id="send-btn" class="send-btn">➤</button>
                    <button id="mic-btn" class="mic-btn" title="Voice command">🎙️</button>
                </div>
            </div>
        </section>

        <!-- Daily Report Tab -->
        <section class="tab-panel" id="tab-report">
            <div class="report-container">
                <div class="report-header">
                    <h2>CEO Daily Report — <span id="report-date">Loading...</span></h2>
                    <button class="refresh-btn" id="refresh-report">↻ Refresh</button>
                </div>
                <div class="report-content" id="report-content">
                    <div class="loading">Generating report from Jon...</div>
                </div>
            </div>
        </section>

        <!-- Agents Tab -->
        <section class="tab-panel" id="tab-agents">
            <div class="agents-container">
                <h2>Tiny's Army — <span id="agent-total">23</span> Agents</h2>
                <div class="agent-grid" id="agent-grid">
                    <div class="loading">Loading agent roster...</div>
                </div>
            </div>
        </section>

        <footer>
            <div class="stats-bar">
                <div class="stat">CPU: <span id="cpu-load">4.2%</span></div>
                <div class="stat">AGENTS: <span id="agent-count">23</span></div>
                <div class="stat">REGION: <span id="current-region">DUBAI</span></div>
            </div>
        </footer>
    </div>
    <script src="app.js?v=3"></script>
</body>
</html>
